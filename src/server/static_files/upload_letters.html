<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">

</head>
<style>
body {
	margin: 0;
	padding: 0;
	font-family: sans-serif;
	background: #f5f5f5;
}

#container {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
	gap: 20px;
	padding: 20px;
	box-sizing: border-box;
}

.card-wrapper {
	background: white;
	border-radius: 8px;
	padding: 10px;
	display: flex;
	flex-direction: column;
	align-items: center;
	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
}

.card-wrapper p {
	margin: 4px 0 6px;
	font-weight: bold;
	font-size: 14px;
}

.card {
	width: 100px;
	height: 100px;
	border: 2px dashed #aaa;
	background: #fafafa;
	object-fit: contain;
	margin-bottom: 8px;
}

input[type="file"] {
	width: 100%;
	font-size: 12px;
}

button{
position: absolute;
    height: 5vh;
    top: 130vh;
    left: 40em;
    width: 12vw;
    /* margin: 2em; */
    font-size: 1.4em;
    border-radius: 1em;
    border: 1px solid black;
    }
    button:hover{
    background :red;
    }

</style>

<body>
	<form id="container" enctype="multipart/form-data"></form>

</body>
<script src="/canvas/upload_letters.js" type="module"></script>

</html>
